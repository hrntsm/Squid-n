name: 開発プロファイル速度比較

on:
  pull_request:
    branches: [main]

concurrency:
  group: dev-profile-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Windows Clippy / test 速度比較
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 現行設定を計測
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Measure-Cargo([string]$Name, [scriptblock]$Command) {
            $elapsed = (Measure-Command { & $Command }).TotalSeconds
            Set-Content -Path "$env:RUNNER_TEMP/$Name.txt" -Value $elapsed
          }

          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/squid-current-clippy"
          Measure-Cargo 'current-clippy-cold' {
            cargo clippy --workspace --all-targets --locked -- -D warnings
            if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          }
          (Get-Item 'crates/squid-n-core/src/lib.rs').LastWriteTime = Get-Date
          Measure-Cargo 'current-clippy-incremental' {
            cargo clippy --workspace --all-targets --locked -- -D warnings
            if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          }

          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/squid-current-test"
          Measure-Cargo 'current-test-cold' {
            cargo test --workspace --no-run --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed" }
          }
          Measure-Cargo 'current-test-run' {
            cargo test --workspace --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          }
          (Get-Item 'crates/squid-n-core/src/lib.rs').LastWriteTime = Get-Date
          Measure-Cargo 'current-test-incremental' {
            cargo test --workspace --no-run --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed" }
          }

      - name: 高速化案へ切り替え
        shell: pwsh
        run: |
          $path = 'Cargo.toml'
          $text = Get-Content $path -Raw
          $old = @'
          [profile.dev]
          opt-level = 1

          [profile.dev.package."*"]
          opt-level = 3
          '@
          $new = @'
          [profile.dev]
          opt-level = 1

          # 開発中の全依存クレート最適化を避け、数値計算の主要依存だけ最適化する。
          [profile.dev.package.faer]
          opt-level = 3
          '@
          if (-not $text.Contains($old)) { throw 'profile.dev block not found' }
          Set-Content -Path $path -Value $text.Replace($old, $new) -NoNewline

      - name: 高速化案を計測
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Measure-Cargo([string]$Name, [scriptblock]$Command) {
            $elapsed = (Measure-Command { & $Command }).TotalSeconds
            Set-Content -Path "$env:RUNNER_TEMP/$Name.txt" -Value $elapsed
          }

          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/squid-candidate-clippy"
          Measure-Cargo 'candidate-clippy-cold' {
            cargo clippy --workspace --all-targets --locked -- -D warnings
            if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          }
          (Get-Item 'crates/squid-n-core/src/lib.rs').LastWriteTime = Get-Date
          Measure-Cargo 'candidate-clippy-incremental' {
            cargo clippy --workspace --all-targets --locked -- -D warnings
            if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          }

          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/squid-candidate-test"
          Measure-Cargo 'candidate-test-cold' {
            cargo test --workspace --no-run --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed" }
          }
          Measure-Cargo 'candidate-test-run' {
            cargo test --workspace --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          }
          (Get-Item 'crates/squid-n-core/src/lib.rs').LastWriteTime = Get-Date
          Measure-Cargo 'candidate-test-incremental' {
            cargo test --workspace --no-run --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed" }
          }

      - name: 結果を表示
        shell: pwsh
        run: |
          $rows = @(
            @('Clippy cold', 'current-clippy-cold.txt', 'candidate-clippy-cold.txt'),
            @('Clippy incremental (core touch)', 'current-clippy-incremental.txt', 'candidate-clippy-incremental.txt'),
            @('test compile cold (--no-run)', 'current-test-cold.txt', 'candidate-test-cold.txt'),
            @('test run (compiled)', 'current-test-run.txt', 'candidate-test-run.txt'),
            @('test incremental compile (core touch)', 'current-test-incremental.txt', 'candidate-test-incremental.txt')
          )

          $lines = @(
            '## Windows 開発プロファイル速度比較',
            '',
            '| 項目 | 現行 (s) | 高速化案 (s) | 改善率 |',
            '|---|---:|---:|---:|'
          )
          foreach ($row in $rows) {
            $current = [double](Get-Content "$env:RUNNER_TEMP/$($row[1])")
            $candidate = [double](Get-Content "$env:RUNNER_TEMP/$($row[2])")
            $improvement = if ($current -eq 0) { 0 } else { ($current - $candidate) / $current * 100 }
            $lines += "| $($row[0]) | $($current.ToString('F2')) | $($candidate.ToString('F2')) | $($improvement.ToString('+0.0;-0.0;0.0'))% |"
          }

          $summary = ($lines -join "`n") + "`n"
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
