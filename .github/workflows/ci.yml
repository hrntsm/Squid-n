name: CI

on:
  pull_request:
    branches: [main]

# 同一 PR への新しい push 時に、進行中の古い実行をキャンセルする。
# 品質ゲートは PR マージ前のみ。main へのマージ後は docs デプロイ（docs.yml）のみ実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: テスト実行
        run: cargo test --workspace --locked
      # gui / mcp は非デフォルト feature のため --workspace だけでは検証されない。
      # 2 クレートを 1 回の cargo 呼び出しで検証し、依存解決・ビルドの重複を減らす。
      # default 構成の検証は上で残し、feature 無効時専用の cfg(not(feature = ...)) も保護する。
      - name: 非デフォルトfeatureテスト実行
        run: >-
          cargo test
          -p squid-n-app
          -p squid-n-mcp
          --features squid-n-app/gui,squid-n-mcp/mcp
          --locked

  clippy:
    name: Clippy静的解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 非デフォルト feature 付きの 2 クレートも 1 回の cargo 呼び出しで解析する。
      # GUI / MCP の feature 固有コードを維持しつつ、個別実行による重複を減らす。
      - name: Clippy実行（非デフォルトfeature）
        run: >-
          cargo clippy
          -p squid-n-app
          -p squid-n-mcp
          --all-targets
          --features squid-n-app/gui,squid-n-mcp/mcp
          --locked
          -- -D warnings

  fmt:
    name: フォーマットチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: フォーマット確認
        run: cargo fmt --all -- --check

  audit:
    name: 脆弱性確認
    runs-on: ubuntu-latest
    # rustsec/audit-check は警告を Check Run API で書き込むが、権限不足や
    # "Not Found" でジョブ自体が落ちることがある。CLI の cargo audit なら
    # 脆弱性の有無だけで exit code が決まり、警告（unmaintained 等）では落ちない。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          # quick-xml の DoS 脆弱性。直接依存は 0.41 に更新済みだが、
          # wayland-scanner / zbus_xml（eframe 経由の推移的依存）が
          # まだ quick-xml ^0.39 を要求しているため、上流の更新待ち。
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  dependency-check:
    name: 依存性チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny実行
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
