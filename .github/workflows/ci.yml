name: CI

on:
  pull_request:
    branches: [main]

# 同一 PR への新しい push 時に、進行中の古い実行をキャンセルする。
# 品質ゲートは PR マージ前のみ。main へのマージ後は docs デプロイ（docs.yml）のみ実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: テスト実行
        run: cargo test --workspace --locked
      # mcp / gui は非デフォルト feature のため --workspace では検証されない。
      # squid-n-io の results（Parquet 結果 I/O）も parquet feature 配下にあり、
      # -p 指定なしでは保証されないため合わせる（workspace 解決では mcp 経由で
      # 有効化されるが、明示指定で io 単体の検証も保証する）。
      # 過去に rmcp API 追従漏れでコンパイル不能のまま放置された経緯があり
      # （dev_docs/v_and_v/p8_review.md）、ここで明示的にビルド・テストして再発を防ぐ。
      # GUI コードのコンパイル漏れ（網羅的 match 等）の検知に加え、gui ゲート内の
      # ユニットテスト（viewer のカメラ計算等）も実行する（build は test に含まれる）。
      # 3 クレートを同一 Cargo 呼び出し（クレート名/機能名形式）にまとめ、
      # 同じ依存グラフの重複構築を避ける。default 構成は上の実行で別に検証する。
      - name: featureテスト実行（MCP/GUI/Parquet）
        run: cargo test -p squid-n-mcp -p squid-n-app -p squid-n-io --features squid-n-mcp/mcp,squid-n-app/gui,squid-n-io/parquet --locked

  clippy:
    name: Clippy静的解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 非デフォルト feature の mcp（bin ターゲット含む）と gui（eframe 経由の
      # GUI コード）に加え、squid-n-io の results（Parquet 結果 I/O）も静的解析の
      # 対象にする。過去に GUI コードが網羅的 match 漏れで
      # コンパイル不能のまま放置された経緯があり（mn_view.rs）、ここで明示的に
      # 検証して再発を防ぐ。3 クレートを同一 Cargo 呼び出し（クレート名/機能名形式）に
      # まとめ、同じ依存グラフの重複構築を避ける。default 構成は上の実行で別に検証する。
      - name: Clippy実行（MCP/GUI/Parquet feature）
        run: cargo clippy -p squid-n-mcp -p squid-n-app -p squid-n-io --all-targets --features squid-n-mcp/mcp,squid-n-app/gui,squid-n-io/parquet --locked -- -D warnings

  fmt:
    name: フォーマットチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: フォーマット確認
        run: cargo fmt --all -- --check

  audit:
    name: 脆弱性確認
    runs-on: ubuntu-latest
    # rustsec/audit-check は警告を Check Run API で書き込むが、権限不足や
    # "Not Found" でジョブ自体が落ちることがある。CLI の cargo audit なら
    # 脆弱性の有無だけで exit code が決まり、警告（unmaintained 等）では落ちない。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          # quick-xml の DoS 脆弱性。直接依存は 0.41 に更新済みだが、
          # wayland-scanner / zbus_xml（eframe 経由の推移的依存）が
          # まだ quick-xml ^0.39 を要求しているため、上流の更新待ち。
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  dependency-check:
    name: 依存性チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny実行
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
