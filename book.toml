[book]
title = "Squid-n ドキュメント"
description = "日本の建築構造計算一貫プログラム Squid-n の利用者向けドキュメント（計算根拠・理論・出典）"
authors = ["Squid-n contributors"]
language = "ja"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/hrntsm/squid-n"
edit-url-template = "https://github.com/hrntsm/squid-n/edit/main/docs/{path}"
mathjax-support = true

# 章トップ（`README.md`）は `index.html` として出力される一方、目次・本文中の
# `README.md` リンクは `README.html` のまま解決されるため、リダイレクトで受ける。
# 章ディレクトリを追加したら、ここにも 1 行追加する。
[output.html.redirect]
"/model_io/README.html" = "index.html"
"/model_edit/README.html" = "index.html"
"/mcp_server/README.html" = "index.html"
"/preparation/README.html" = "index.html"
"/result_view/README.html" = "index.html"
"/calc_basis/README.html" = "index.html"
"/calc_basis/01_荷重/README.html" = "index.html"
"/calc_basis/02_材料/README.html" = "index.html"
"/calc_basis/03_断面性能/README.html" = "index.html"
"/calc_basis/04_要素剛性/README.html" = "index.html"
"/calc_basis/05_構造解析/README.html" = "index.html"
"/calc_basis/06_一次設計/README.html" = "index.html"
"/calc_basis/07_二次設計/README.html" = "index.html"
"/calc_basis/08_部材終局耐力/README.html" = "index.html"
"/calc_basis/09_限界耐力計算/README.html" = "index.html"
"/calc_basis/10_免震制振/README.html" = "index.html"
"/calc_basis/11_数量積算/README.html" = "index.html"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
